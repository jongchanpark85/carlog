# Car Log — nginx site config (template).
# Variables ${PORT} are substituted by docker-entrypoint.sh at start.

server {
  listen ${PORT} default_server;
  listen [::]:${PORT} default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gzip — small wins for HTML/JS/CSS, especially on Cloud Run.
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types
    text/plain text/css text/javascript application/javascript
    application/json image/svg+xml application/manifest+json;

  # Security baseline (relaxed CSP — self-hosted fonts allowed).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  # Healthcheck endpoint for ECS / App Runner / k8s.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # HTML / SW / manifest — never cache (always fetch latest).
  location ~* \.(html|json)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires 0;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }

  # Long cache for static assets (fingerprintless — bumped via cache-name in sw.js).
  location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
